name: Publish

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v[0-9]*'
      - '[0-9]*'
    paths:
      - '.github/workflows/publish.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      ORG_GRADLE_PROJECT_RepsyUsername: siredvin
      ORG_GRADLE_PROJECT_RepsyPassword: ${{ secrets.REPSY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read project version
        id: version
        shell: bash
        run: |
          version=$(awk -F= '$1 ~ /^[[:space:]]*projectVersion[[:space:]]*$/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit }' gradle.properties)
          if [ -z "$version" ]; then
            echo "projectVersion was not found in gradle.properties" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check
        run: ./gradlew --no-daemon check

      - name: Check Repsy version
        id: repsy
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          status=$(curl --location --silent --output /dev/null --write-out "%{http_code}" --head "https://repo.repsy.io/siredvin/default/site/siredvin/modding-buildenv/$version/modding-buildenv-$version.pom")
          echo "exists=$([ "$status" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish to Repsy
        if: steps.repsy.outputs.exists == 'false'
        run: ./gradlew --no-daemon publishAllPublicationsToRepsyRepository
